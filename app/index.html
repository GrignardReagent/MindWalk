<title>MindWalk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a trail map fills the screen; the thumb-reach dock holds the one big control. Recording takes over the whole screen as a single tap target. */
:root {
  /* Palette: space indigo #22223b, dusty grape #4a4e69, lilac ash #9a8c98, almond silk #c9ada7, parchment #f2e9e4 */
  --bg: #f2e9e4; --panel: #f9f4f1; --ink: #22223b; --muted: #4a4e69; --line: #c9ada7; --contour: #e7dad3;
  --accent: #4a4e69; --on-accent: #f2e9e4;
  --b0: #4a4e69; --b1: #7d5d56; --b2: #56627f; --b3: #8a5a6b; --b4: #6e6370;
  --display: "Bricolage Grotesque", -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  --body: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #22223b; --panel: #2b2b47; --ink: #f2e9e4; --muted: #ab9eaa; --line: #4a4e69; --contour: #2a2a45;
  --accent: #c9ada7; --on-accent: #22223b;
  --b0: #a3a7c2; --b1: #c9ada7; --b2: #8fa3c4; --b3: #d8a3b4; --b4: #b3a1b0; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #22223b; --panel: #2b2b47; --ink: #f2e9e4; --muted: #ab9eaa; --line: #4a4e69; --contour: #2a2a45;
  --accent: #c9ada7; --on-accent: #22223b;
  --b0: #a3a7c2; --b1: #c9ada7; --b2: #8fa3c4; --b3: #d8a3b4; --b4: #b3a1b0; color-scheme: dark;
}
html, body { height: 100%; }
body {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--body); overflow: hidden;
}
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header {
  display: flex; align-items: center; gap: 10px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.title-block { min-width: 0; flex: 1; }
h1 { margin: 0; font: 800 20px/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.tabs button { border: 0; background: none; min-height: 40px; padding: 0 12px; font-size: 14px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#lang { flex: none; min-height: 42px; min-width: 44px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: none; font-size: 14px; color: var(--ink); }

main { position: relative; min-height: 0; border-block: 1px solid var(--line); }
#mapView {
  position: absolute; inset: 0; overflow: hidden; touch-action: none;
  background: repeating-radial-gradient(circle at 50% 50%, transparent 0 46px, var(--contour) 46px 47px);
}
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#stage svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#stage path { fill: none; stroke-width: 2.5; stroke-linecap: round; }
.node {
  position: absolute; transform: translate(-50%, -50%); width: max-content; max-width: 132px; padding: 6px 9px;
  border: 2px solid var(--branch); border-radius: 8px; background: var(--panel); text-align: left;
  font-size: 14px; line-height: 1.3; overflow-wrap: anywhere;
}
.node.top { font-weight: 650; background: var(--branch); border-color: var(--branch); color: var(--bg); }
.node.root {
  max-width: 150px; text-align: center; padding: 10px 14px; border: 0; border-radius: 999px;
  background: var(--ink); color: var(--bg); font: 800 16px/1.25 var(--display); cursor: default;
}
#outlineView { position: absolute; inset: 0; overflow-y: auto; padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#outlineView ul { list-style: none; margin: 0; padding-left: 16px; border-left: 2px solid var(--branch, var(--line)); }
#outlineView > ul { padding-left: 0; border: 0; }
#outlineView li { margin-block: 4px; }
#outlineView li button { display: block; width: 100%; min-height: 40px; padding: 7px 8px; border: 0; background: none; text-align: left; }
#outlineView li.top > button { font-weight: 700; font-size: 17px; color: var(--branch); }
#copy { margin-top: 14px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
#empty { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; color: var(--muted); pointer-events: none; }
#empty strong { display: block; color: var(--ink); font: 800 22px/1.3 var(--display); margin-bottom: 4px; }

footer {
  display: grid; gap: 8px; padding-block: 10px; background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#status { display: flex; align-items: center; gap: 8px; min-height: 22px; font-size: 14px; color: var(--muted); }
#status span { flex: 1; min-width: 0; }
#status.error { color: var(--accent); font-weight: 600; }
#retry { min-height: 40px; padding: 0 14px; border: 1px solid currentColor; border-radius: 8px; background: none; color: var(--accent); flex: none; }
.compose { display: flex; gap: 8px; align-items: flex-end; }
#note {
  flex: 1; min-width: 0; height: 48px; max-height: 120px; padding: 11px 12px; resize: none; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); font-size: 16px;
}
#send { height: 48px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 650; flex: none; }
#mic {
  width: 100%; min-height: 84px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent);
  font: 800 25px/1 var(--display); -webkit-tap-highlight-color: transparent;
}
.options { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.options select, .options > button { min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--ink); font-size: 14px; }
#tidy { margin-left: auto; }
#undo { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: none; flex: none; }
.options label { display: flex; align-items: center; gap: 6px; min-height: 40px; }
.options input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.upload { padding-inline: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); cursor: pointer; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

#focus {
  position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; width: 100%; gap: 14px; border: 0; text-align: left;
  padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--accent); color: var(--on-accent); -webkit-tap-highlight-color: transparent;
}
#clock { font: 800 60px/1 var(--display); font-variant-numeric: tabular-nums; }
#liveBox {
  min-height: 0; overflow: hidden; padding: 14px 16px;
  border: 2px solid color-mix(in srgb, var(--on-accent) 45%, transparent); border-radius: 12px;
  background: color-mix(in srgb, var(--on-accent) 12%, transparent);
}
#liveText { display: block; font-size: 22px; line-height: 1.45; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
#liveText:empty::before { content: attr(data-placeholder); opacity: 0.75; font-weight: 500; }
#focusNote { font-size: 15px; line-height: 1.4; opacity: 0.9; }
#focusHint { font: 800 22px/1.2 var(--display); }

#sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: color-mix(in srgb, var(--ink) 45%, transparent); }
#sheet > div {
  width: 100%; max-height: 75%; overflow-y: auto; display: grid; gap: 10px; padding-top: 18px; background: var(--panel); border-radius: 12px 12px 0 0;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#sheetText { margin: 0; font-size: 19px; font-weight: 650; }
#sheetQuote { margin: 0; color: var(--muted); }
.sheet-actions { display: flex; gap: 8px; }
.sheet-actions button { flex: 1; min-height: 48px; border: 1px solid var(--line); border-radius: 8px; background: none; }
#sheetDelete { color: var(--accent); border-color: currentColor; }
#lock { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; padding: 24px; background: var(--bg); }
#lock > div { display: grid; gap: 12px; width: min(340px, 100%); }
#lock strong { font: 800 24px/1.25 var(--display); }
#lock span { color: var(--muted); }
#lockKey { min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: inherit; color: inherit; }
#lock button { min-height: 48px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
#lock #lockError { min-height: 22px; color: var(--accent); font-weight: 600; }
@media (min-width: 720px) { #mic { min-height: 64px; } .node { max-width: 170px; } }
@media (prefers-reduced-motion: no-preference) {
  #focus[data-on] { animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 50% { filter: brightness(1.08); } }
}
</style>

<header>
  <div class="title-block">
    <h1 id="title">MindWalk</h1>
    <div id="stats"></div>
  </div>
  <div class="tabs">
    <button id="tabMap" type="button" aria-pressed="true" data-i18n="tabMap"></button>
    <button id="tabOutline" type="button" aria-pressed="false" data-i18n="tabOutline"></button>
  </div>
  <button id="lang" type="button"></button>
</header>

<main>
  <div id="mapView"><div id="stage"><svg id="links" aria-hidden="true"></svg></div></div>
  <div id="outlineView" hidden><ul id="outline"></ul><button id="copy" type="button" data-i18n="copy"></button></div>
  <div id="empty" hidden><div><strong data-i18n="emptyTitle"></strong><span data-i18n="emptyBody"></span></div></div>
</main>

<footer>
  <div id="status" role="status"><span id="statusText"></span><button id="retry" type="button" hidden data-i18n="retry"></button><button id="undo" type="button" hidden data-i18n="undo"></button></div>
  <div class="compose">
    <textarea id="note"></textarea>
    <button id="send" type="button" data-i18n="send"></button>
  </div>
  <button id="mic" type="button" hidden data-i18n="mic"></button>
  <div class="options">
    <select id="speechLang">
      <option value="zh" data-i18n="speechZh"></option>
      <option value="en" data-i18n="speechEn"></option>
      <option value="auto" data-i18n="speechAuto"></option>
    </select>
    <label id="uploadLabel" class="upload"><span data-i18n="upload"></span><input id="upload" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg"></label>
    <button id="tidy" type="button" hidden data-i18n="tidy"></button>
  </div>
</footer>

<button id="focus" type="button" hidden>
  <span id="clock">00:00</span>
  <span id="liveBox"><span id="liveText"></span></span>
  <span id="focusNote"></span>
  <span id="focusHint" data-i18n="focusHint"></span>
</button>

<div id="sheet" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="sheetText">
    <p id="sheetText"></p>
    <p id="sheetQuote"></p>
    <div class="sheet-actions">
      <button id="sheetClose" type="button" data-i18n="close"></button>
      <button id="sheetDelete" type="button"></button>
    </div>
  </div>
</div>

<form id="lock" hidden>
  <div>
    <strong data-i18n="lockTitle"></strong>
    <span data-i18n="lockBody"></span>
    <input id="lockKey" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <button type="submit" data-i18n="unlock"></button>
    <span id="lockError" role="alert"></span>
  </div>
</form>

<script src="organize.js"></script>
<script>
(() => {
  const { ROOT, DEFAULT_TITLE, emptyMap, buildPrompt, buildTidyPrompt, applyResult, applyTidy, vocabularyHint, removeSubtree, toMarkdown } = window.MindWalk;
  const $ = (id) => document.getElementById(id);
  const KEY = "mindwalk.map.v1";
  const LANG = "mindwalk.lang";
  const ACCESS = "mindwalk.key";
  const SPEECH = "mindwalk.speech";
  const BRANCHES = 5;

  const store = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };

  const STRINGS = {
    zh: {
      switchTo: "EN", switchLabel: "Switch to English", defaultTitle: "我的想法",
      tabMap: "导图", tabOutline: "大纲", copy: "复制大纲", emptyTitle: "边走边说，这里长出导图", emptyBody: "说完一段，想法会自动归到对应的分支。",
      retry: "重试", noteLabel: "想法内容", send: "整理", mic: "开始录音", upload: "上传录音", focusHint: "点屏幕任意位置，结束并整理",
      close: "关闭", delete: "删除", deleteConfirm: "再点一次，连同子节点删除", quote: (q) => `原话：${q}`,
      placeholderTyped: "也可以在这里打字", placeholderKeyboard: "点手机键盘上的麦克风说话，说完点整理",
      ideas: (n) => `${n} 个想法`, pendingCount: (n) => `${n} 段待整理`, example: "示例，开始说话后会被替换",
      recordingIOS: "iPhone 不支持网页锁屏录音，请保持屏幕亮着。要锁屏，请用语音备忘录录完再上传。",
      recordingLock: "可以锁屏放进口袋。结束时会告诉你有没有漏录。",
      livePlaceholder: "开始说吧。每句话说完稍停一下，字就会出现在这里。", finishing: "正在转写最后一句…点一下可直接关闭",
      cloudSlow: "云端暂时连不上，新内容先存在这台手机上", cloudLost: "云端同步已断开，新内容先存在这台手机上", cloudFailed: "没能同步到云端，内容还在这台手机上",
      organizing: (n) => `正在整理 ${n} 段话…`, added: (n) => `已加入 ${n} 个想法`,
      gap: (g) => `录音时长 ${minutes(g.duration, " 分", " 秒")}，实际过了 ${minutes(g.wall, " 分", " 秒")}，中间有一段没录到。`,
      addedGap: (n, g) => `已加入 ${n} 个想法。${STRINGS.zh.gap(g)}`,
      noMic: "没有麦克风权限。请在浏览器设置里允许这个网站使用麦克风。",
      transcribing: (mb) => `正在转写录音（${mb} MB）…`, noSpeech: "这段录音里没有听到说话。",
      organizeFailed: "没能整理，这段话已保存。有网络时点重试。", clipSaved: "录音已保存在手机上，有网络时点重试。", fileTooLarge: "这个文件超过 25 MB。请分成几段再上传。",
      nothingTyped: "先说点什么，或者打几个字。", nothingDictated: "先点键盘上的麦克风说几句。",
      copied: "大纲已复制", copyFailed: "这里不能自动复制，请长按大纲文字选择复制。", waiting: (n) => `有 ${n} 段话待整理`,
      fail_not_granted: "需要允许这个页面使用 Claude。刷新页面，在弹窗里点允许。", fail_signed_out: "请先登录 Claude，再点重试。",
      fail_session_expired: "登录已过期。重新登录后点重试。", fail_rate_limited: "请求太频繁，稍后再点重试。",
      fail_no_api_key: "服务器还没有配置 OPENAI_API_KEY。", fail_quota: "API 额度不足。补足后点重试。",
      fail_bad_audio: "这个音频格式不能转写。支持 m4a、mp3、wav、webm、ogg。", fail_too_large: "录音超过 25 MB，无法转写。",
      fail_locked: "需要访问密钥。",
      speechZh: "识别：中文", speechEn: "识别：English", speechAuto: "识别：自动", speechLabel: "说话用的语言",
      tidy: "精简导图", tidying: "正在精简导图…", tidied: (a, b) => `已精简：${a} → ${b} 个节点`, tidyFailed: "没能精简，导图没有改动。",
      undo: "撤销", undone: "已撤销",
      lockTitle: "输入访问密钥", lockBody: "密钥只存在这台手机上，只需输入一次。", lockPlaceholder: "访问密钥", unlock: "进入",
      lockWrong: "密钥不对，再试一次。", lockOffline: "连不上服务器，检查网络后再试。",
    },
    en: {
      switchTo: "中文", switchLabel: "切换到中文", defaultTitle: "My ideas",
      tabMap: "Map", tabOutline: "Outline", copy: "Copy outline", emptyTitle: "Talk as you walk, and your map grows here", emptyBody: "Each idea lands on the right branch once you finish speaking.",
      retry: "Retry", noteLabel: "Your idea", send: "Organize", mic: "Start recording", upload: "Upload audio", focusHint: "Tap anywhere to finish and organize",
      close: "Close", delete: "Delete", deleteConfirm: "Tap again to delete with its sub-ideas", quote: (q) => `You said: ${q}`,
      placeholderTyped: "Or type here", placeholderKeyboard: "Tap the mic on your keyboard, then tap Organize",
      ideas: (n) => `${n} ${n === 1 ? "idea" : "ideas"}`, pendingCount: (n) => `${n} waiting`, example: "Example, replaced once you start talking",
      recordingIOS: "iPhone web pages can't record while locked, so keep the screen on. To lock it, record in Voice Memos and upload afterwards.",
      recordingLock: "You can lock your phone and pocket it. You'll be told if anything was missed.",
      livePlaceholder: "Start talking. Pause briefly after each sentence and the words appear here.", finishing: "Transcribing the last sentence… Tap to close now",
      cloudSlow: "Can't reach the cloud right now. New notes stay on this phone.", cloudLost: "Cloud sync disconnected. New notes stay on this phone.", cloudFailed: "Couldn't sync to the cloud. Your notes are still on this phone.",
      organizing: (n) => `Organizing ${n} ${n === 1 ? "note" : "notes"}…`, added: (n) => `Added ${n} ${n === 1 ? "idea" : "ideas"}`,
      gap: (g) => `The recording is ${minutes(g.duration, "m", "s")} long but ${minutes(g.wall, "m", "s")} passed, so part of it was missed.`,
      addedGap: (n, g) => `${STRINGS.en.added(n)}. ${STRINGS.en.gap(g)}`,
      noMic: "No microphone access. Allow this site to use the microphone in your browser settings.",
      transcribing: (mb) => `Transcribing recording (${mb} MB)…`, noSpeech: "No speech was heard in this recording.",
      organizeFailed: "Couldn't organize this. It's saved, so tap Retry when you're online.", clipSaved: "The recording is saved on this phone. Tap Retry when you're online.", fileTooLarge: "This file is over 25 MB. Split it into shorter parts and upload them.",
      nothingTyped: "Say something or type a few words first.", nothingDictated: "Tap the mic on your keyboard and say something first.",
      copied: "Outline copied", copyFailed: "Can't copy automatically here. Press and hold the outline text to copy it.", waiting: (n) => `${n} ${n === 1 ? "note" : "notes"} waiting`,
      fail_not_granted: "This page needs permission to use Claude. Refresh and tap Allow.", fail_signed_out: "Sign in to Claude, then tap Retry.",
      fail_session_expired: "Your sign-in expired. Sign in again, then tap Retry.", fail_rate_limited: "Too many requests. Wait a moment, then tap Retry.",
      fail_no_api_key: "The server has no OPENAI_API_KEY set.", fail_quota: "The API quota has run out. Top it up, then tap Retry.",
      fail_bad_audio: "This audio format can't be transcribed. Use m4a, mp3, wav, webm or ogg.", fail_too_large: "The recording is over 25 MB and can't be transcribed.",
      fail_locked: "An access key is needed.",
      speechZh: "Speech: Chinese", speechEn: "Speech: English", speechAuto: "Speech: Auto", speechLabel: "Language you speak",
      tidy: "Tidy map", tidying: "Tidying the map…", tidied: (a, b) => `Tidied: ${a} → ${b} ideas`, tidyFailed: "Couldn't tidy. The map is unchanged.",
      undo: "Undo", undone: "Undone",
      lockTitle: "Enter access key", lockBody: "The key is kept on this phone, so you only enter it once.", lockPlaceholder: "Access key", unlock: "Unlock",
      lockWrong: "That key is wrong. Try again.", lockOffline: "Can't reach the server. Check your connection and try again.",
    },
  };

  const minutes = (seconds, m, s) => {
    const total = Math.round(seconds);
    return `${Math.floor(total / 60)}${m} ${total % 60}${s}`;
  };

  let lang = store.get(LANG) in STRINGS ? store.get(LANG) : /^zh/i.test(navigator.language) ? "zh" : "en";
  let speechLang = ["zh", "en", "auto"].includes(store.get(SPEECH)) ? store.get(SPEECH) : lang;
  let accessKey = store.get(ACCESS) || "";
  // A link like https://…/#key=… unlocks the page once; the fragment never reaches the server.
  const keyInLink = location.hash.match(/[#&]key=([^&]+)/);
  if (keyInLink) {
    try { accessKey = decodeURIComponent(keyInLink[1]); store.set(ACCESS, accessKey); } catch {}
    history.replaceState(null, "", location.pathname + location.search);
  }
  let status = null;

  const t = (key, ...args) => {
    const value = STRINGS[lang][key];
    return typeof value === "function" ? value(...args) : value;
  };
  const failureKey = (e, fallback) => (e && STRINGS.zh[`fail_${e.code}`] ? `fail_${e.code}` : fallback);
  const shownTitle = () => (map.title === DEFAULT_TITLE ? t("defaultTitle") : map.title);

  let map = { ...emptyMap(), ...store.get(KEY) };
  let selected = null;
  let view = { x: 0, y: 0, s: 1 };
  let bounds = null;
  let busy = false;
  let gapNotice = null;
  let undoMap = null;

  /* ---------- Claude and storage backends ---------- */

  let sample = null;
  let mapDoc = null;
  let writing = false;
  let writeAgain = false;

  const ready = (async () => {
    if (!window.claude) return;
    sample = await claude.use("sample");
    const db = await claude.use("db");
    if (!db) return;
    mapDoc = db.doc("maps/main");
    const slow = setTimeout(() => setStatus("cloudSlow"), 10000);
    mapDoc.onSnapshot((snap) => {
      if (!snap.metadata.fromCache) clearTimeout(slow);
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists) {
        if (!snap.metadata.fromCache && map.updatedAt) pushMap();
        return;
      }
      const remote = snap.data();
      if ((remote.updatedAt || 0) > map.updatedAt) {
        map = { ...emptyMap(), ...JSON.parse(JSON.stringify(remote)) };
        store.set(KEY, map);
        render();
        flush();
      }
    }, () => { clearTimeout(slow); setStatus("cloudLost"); });
  })();

  async function pushMap() {
    if (!mapDoc) return;
    if (writing) { writeAgain = true; return; }
    writing = true;
    try { await mapDoc.set(JSON.parse(JSON.stringify(map))); }
    catch { setStatus("cloudFailed"); }
    writing = false;
    if (writeAgain) { writeAgain = false; pushMap(); }
  }

  function save() {
    store.set(KEY, map);
    pushMap();
  }

  // Every server call carries the access key. A 401 brings up the key screen.
  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: { ...options.headers, "x-access-key": encodeURIComponent(accessKey) } });
    if (res.status === 401) {
      showLock();
      throw { code: "locked" };
    }
    if (!res.ok) throw { code: (await res.json().catch(() => ({}))).code || "upstream_error" };
    return res;
  }

  async function ask(path, body, prompt) {
    await ready;
    if (window.claude) {
      if (!sample) throw { code: "signed_out" };
      return sample.json(prompt, { cache: false, effort: "low" });
    }
    const res = await api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    return res.json();
  }

  function dropUndo() {
    undoMap = null;
    $("undo").hidden = true;
  }

  /* ---------- Queue: notes stay in map.pending until Claude has placed them ---------- */

  function enqueue(text) {
    const clean = text.trim();
    if (!clean) return;
    map = { ...map, pending: [...map.pending, { text: clean, at: Date.now() }], updatedAt: Date.now() };
    save();
    render();
    flush();
  }

  // While recording, notes are organized in batches, so the model sees whole thoughts.
  const ripe = () => !recording
    || map.pending.reduce((sum, n) => sum + n.text.length, 0) >= ORGANIZE_EVERY_CHARS
    || Date.now() - map.pending[0].at >= ORGANIZE_EVERY_MS;

  async function flush() {
    if (busy || !map.pending.length || !ripe()) return;
    busy = true;
    $("retry").hidden = true;
    setStatus("organizing", false, map.pending.length);
    const batch = map.pending;
    const text = batch.map((n) => n.text).join("\n");
    try {
      if (map.example) map = { ...emptyMap(), pending: map.pending, updatedAt: map.updatedAt };
      const result = await ask("api/organize", { map, text }, buildPrompt(map, text));
      const before = map.nodes.length;
      const sent = new Set(batch.map((n) => n.at));
      map = applyResult(map, result, text, Date.now());
      map.pending = map.pending.filter((n) => !sent.has(n.at));
      dropUndo();
      save();
      render();
      const added = map.nodes.length - before;
      if (gapNotice) setStatus("addedGap", true, added, gapNotice);
      else setStatus("added", false, added);
      gapNotice = null;
    } catch (e) {
      setStatus(failureKey(e, "organizeFailed"), true);
      $("retry").hidden = false;
      busy = false;
      return;
    }
    busy = false;
    flush();
  }

  // Asks the model to merge, regroup and shorten the whole map. One tap undoes it.
  async function tidyMap() {
    if (busy || map.nodes.length < 2) return;
    busy = true;
    $("retry").hidden = true;
    dropUndo();
    setStatus("tidying");
    try {
      const before = map;
      const result = await ask("api/tidy", { map }, buildTidyPrompt(map));
      const tidied = applyTidy(map, result, Date.now());
      if (tidied === map) throw {};
      map = tidied;
      undoMap = before;
      save();
      render();
      setStatus("tidied", false, before.nodes.length, map.nodes.length);
      $("undo").hidden = false;
    } catch (e) {
      setStatus(failureKey(e, "tidyFailed"), true);
    }
    busy = false;
    flush();
  }

  /* ---------- Recording: audio is saved as it arrives, so nothing depends on the page staying awake ---------- */

  const MAX_UPLOAD_BYTES = 25 * 1024 * 1024;
  const MAX_RECORD_SECONDS = 2.5 * 3600;
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const micAllowed = !document.featurePolicy || document.featurePolicy.allowsFeature("microphone");
  const serverMode = !window.claude;
  let recordingUsable = serverMode && micAllowed && Boolean(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  const clips = (() => {
    const memory = [];
    const open = new Promise((resolve) => {
      try {
        const request = indexedDB.open("mindwalk-audio", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("chunks", { autoIncrement: true });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
    const run = (mode, work) => open.then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction("chunks", mode);
      const result = work(tx.objectStore("chunks"));
      tx.oncomplete = () => resolve(result.result);
      tx.onerror = tx.onabort = () => reject(tx.error);
    }));
    return {
      async add(chunk) {
        if (await open) await run("readwrite", (s) => s.add(chunk));
        else memory.push(chunk);
      },
      async all() {
        const rows = (await open) ? await run("readonly", (s) => s.getAll()) : memory;
        const grouped = new Map();
        for (const row of rows) {
          if (!grouped.has(row.clip)) grouped.set(row.clip, { clip: row.clip, type: row.type, parts: [] });
          grouped.get(row.clip).parts.push(row.data);
        }
        return [...grouped.values()].map((c) => ({ ...c, blob: new Blob(c.parts, { type: c.type }) }));
      },
      async remove(clip) {
        if (!(await open)) { memory.splice(0, memory.length, ...memory.filter((c) => c.clip !== clip)); return; }
        await run("readwrite", (s) => {
          const request = s.openCursor();
          request.onsuccess = () => {
            const cursor = request.result;
            if (!cursor) return;
            if (cursor.value.clip === clip) cursor.delete();
            cursor.continue();
          };
          return request;
        });
      },
    };
  })();

  // Speech is cut into short clips at natural pauses, so each sentence is
  // transcribed and shown in the box a moment after it is said. Clips overlap
  // briefly so no word falls between two, and each clip stays saved on the
  // phone until its words are safely queued.
  const MIN_CLIP_SECONDS = 4;
  const MAX_CLIP_SECONDS = 25;
  const PAUSE_SECONDS = 0.6;
  const CLIP_OVERLAP_MS = 500;
  const ORGANIZE_EVERY_MS = 2 * 60 * 1000;
  const ORGANIZE_EVERY_CHARS = 400;
  let recording = null;
  let wakeLock = null;
  let ticker = 0;
  let uploadRun = null;
  let uploadAgain = false;
  let heard = [];
  const openClips = new Set();
  const wallSeconds = new Map();

  const extensionFor = (type) => (/mp4|m4a|aac/.test(type) ? "m4a" : /ogg/.test(type) ? "ogg" : /mpeg|mp3/.test(type) ? "mp3" : /wav/.test(type) ? "wav" : "webm");

  function pickFormat() {
    return ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find((type) => MediaRecorder.isTypeSupported(type)) || "";
  }

  function startSegment(stream) {
    const type = pickFormat();
    const recorder = new MediaRecorder(stream, { ...(type && { mimeType: type }), audioBitsPerSecond: 32000 });
    const segment = { recorder, clip: `clip-${Date.now()}`, type: recorder.mimeType || type, startedAt: Date.now(), voiced: 0, saves: [] };
    segment.stopped = new Promise((resolve) => { recorder.onstop = resolve; });
    recorder.ondataavailable = (event) => {
      if (event.data.size) segment.saves.push(clips.add({ clip: segment.clip, type: segment.type, data: event.data }));
    };
    recorder.onerror = () => { if (recording && recording.segment === segment) finishRecording(); };
    openClips.add(segment.clip);
    recorder.start(5000);
    return segment;
  }

  async function closeSegment(segment) {
    wallSeconds.set(segment.clip, (Date.now() - segment.startedAt) / 1000);
    if (segment.recorder.state !== "inactive") {
      segment.recorder.stop();
      await segment.stopped;
    }
    await Promise.allSettled(segment.saves);
    openClips.delete(segment.clip);
  }

  function rotateSegment() {
    const old = recording.segment;
    try {
      recording.segment = startSegment(recording.stream);
    } catch {
      return; // Keep the current clip going rather than risk a gap.
    }
    const closed = new Promise((resolve) => setTimeout(resolve, CLIP_OVERLAP_MS)).then(() => closeSegment(old));
    recording.closing = Promise.all([recording.closing, closed]);
    closed.then(uploadClips);
  }

  // Watches the microphone level to find pauses. Audio callbacks keep running
  // when timers are throttled; the clock in tick() is the fallback.
  function listenForPauses(context, stream) {
    if (!context) return;
    try {
      const source = context.createMediaStreamSource(stream);
      const meter = context.createScriptProcessor(2048, 1, 1);
      const mute = context.createGain();
      mute.gain.value = 0;
      let floor = 0;
      meter.onaudioprocess = (event) => {
        if (!recording) return;
        const data = event.inputBuffer.getChannelData(0);
        let sum = 0;
        for (let i = 0; i < data.length; i += 1) sum += data[i] * data[i];
        const level = Math.sqrt(sum / data.length);
        const seconds = data.length / context.sampleRate;
        floor = !floor || level < floor ? level : floor + (level - floor) * 0.002;
        const segment = recording.segment;
        if (level > Math.max(floor * 3, 0.006)) {
          segment.voiced += seconds;
          recording.quiet = 0;
        } else {
          recording.quiet += seconds;
        }
        const age = (Date.now() - segment.startedAt) / 1000;
        if (age >= MIN_CLIP_SECONDS && segment.voiced >= 0.4 && recording.quiet >= PAUSE_SECONDS) rotateSegment();
      };
      source.connect(meter);
      meter.connect(mute);
      mute.connect(context.destination);
      context.resume().catch(() => {});
    } catch {}
  }

  async function startRecording() {
    if (recording) return;
    // Made during the tap, so iOS lets it run.
    const Context = window.AudioContext || window.webkitAudioContext;
    let context = null;
    try { context = Context ? new Context() : null; } catch {}
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
      });
    } catch {
      if (context) context.close().catch(() => {});
      setStatus("noMic", true);
      return;
    }
    recording = { stream, context, startedAt: Date.now(), quiet: 0, closing: null, segment: startSegment(stream) };
    listenForPauses(context, stream);
    stream.getAudioTracks()[0].addEventListener("ended", () => finishRecording());

    heard = [];
    renderLive();
    $("focusNote").textContent = t(isIOS ? "recordingIOS" : "recordingLock");
    $("focusHint").textContent = t("focusHint");
    $("focus").hidden = false;
    $("focus").dataset.on = "1";
    tick();
    ticker = setInterval(tick, 1000);
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }

  function tick() {
    if (!recording) return;
    const seconds = Math.floor((Date.now() - recording.startedAt) / 1000);
    $("clock").textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    if (seconds >= MAX_RECORD_SECONDS || recording.segment.recorder.state === "inactive") finishRecording();
    else if (Date.now() - recording.segment.startedAt >= MAX_CLIP_SECONDS * 1000) rotateSegment();
    else if (map.pending.length) flush();
  }

  // The box stays up until the last sentence is in it, unless tapped again.
  async function finishRecording() {
    const session = recording;
    if (!session) return;
    recording = null;
    clearInterval(ticker);
    delete $("focus").dataset.on;
    $("focusHint").textContent = t("finishing");
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    await Promise.all([closeSegment(session.segment), session.closing]);
    session.stream.getTracks().forEach((track) => track.stop());
    if (session.context) session.context.close().catch(() => {});
    await uploadClips();
    closeFocus();
    flush();
  }

  function closeFocus() {
    if (!recording) $("focus").hidden = true;
  }

  function renderLive() {
    const cjkEnd = /[\u3000-\u303f\u3400-\u9fff\uff00-\uffef]$/;
    const text = heard.reduce((all, part) => (all && !cjkEnd.test(all) ? `${all} ${part}` : all + part), "");
    $("liveText").textContent = uploadRun ? `${text} …` : text;
    $("liveBox").scrollTop = $("liveBox").scrollHeight;
  }

  function uploadClips() {
    if (uploadRun) {
      uploadAgain = true;
      return uploadRun;
    }
    uploadRun = (async () => {
      $("retry").hidden = true;
      let ok;
      do {
        uploadAgain = false;
        ok = await uploadOnce();
      } while (ok && uploadAgain);
      uploadRun = null;
      renderLive();
    })();
    return uploadRun;
  }

  // A clip leaves the device only after its words are safely in map.pending.
  async function uploadOnce() {
    let gap = null;
    try {
      for (const clip of await clips.all()) {
        if (openClips.has(clip.clip)) break; // Later clips wait, so words stay in order.
        setStatus("transcribing", false, Math.max(1, Math.round(clip.blob.size / 1048576)));
        renderLive();
        const query = new URLSearchParams({ lang: speechLang, hint: vocabularyHint(map), prev: heard.join(" ").slice(-80) });
        const res = await api(`api/transcribe?${query}`, {
          method: "POST",
          headers: { "content-type": clip.type || "audio/webm", "x-file-extension": extensionFor(clip.type) },
          body: clip.blob,
        });
        const { text, duration } = await res.json();
        const wall = wallSeconds.get(clip.clip);
        if (duration && wall && wall - duration > 20) gap = { duration, wall };
        if (text && text.trim()) {
          heard.push(text.trim());
          renderLive();
          enqueue(text);
        } else if (clip.clip.startsWith("file-") || (!recording && !heard.length)) {
          setStatus("noSpeech");
        }
        await clips.remove(clip.clip);
      }
      if (gap) { gapNotice = gap; setStatus("gap", true, gap); }
      return true;
    } catch (e) {
      setStatus(failureKey(e, "clipSaved"), true);
      $("retry").hidden = false;
      return false;
    }
  }

  async function addAudioFile(file) {
    if (!file) return;
    if (file.size > MAX_UPLOAD_BYTES) {
      setStatus("fileTooLarge", true);
      return;
    }
    await clips.add({ clip: `file-${Date.now()}`, type: file.type || "audio/mp4", data: file });
    uploadClips();
  }

  /* ---------- Rendering ---------- */

  function setStatus(key, isError, ...args) {
    status = { key, isError, args };
    showStatus();
  }

  function showStatus() {
    if (!status) return;
    $("statusText").textContent = t(status.key, ...status.args);
    $("status").classList.toggle("error", Boolean(status.isError));
  }

  function applyLanguage() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $("lang").textContent = t("switchTo");
    $("lang").setAttribute("aria-label", t("switchLabel"));
    $("note").setAttribute("aria-label", t("noteLabel"));
    $("speechLang").setAttribute("aria-label", t("speechLabel"));
    $("speechLang").value = speechLang;
    $("lockKey").placeholder = t("lockPlaceholder");
    $("liveText").dataset.placeholder = t("livePlaceholder");
    renderControls();
    showStatus();
    render();
  }

  function renderControls() {
    $("mic").hidden = !recordingUsable;
    $("uploadLabel").hidden = !serverMode;
    $("speechLang").hidden = !serverMode;
    $("note").placeholder = t(recordingUsable ? "placeholderTyped" : "placeholderKeyboard");
  }

  function childrenOf() {
    const kids = new Map();
    for (const n of map.nodes) {
      const parent = kids.has(n.parent) || n.parent === ROOT || map.nodes.some((m) => m.id === n.parent) ? n.parent : ROOT;
      if (!kids.has(parent)) kids.set(parent, []);
      kids.get(parent).push(n);
    }
    return kids;
  }

  // Radial layout: each branch gets an angle share proportional to its leaves,
  // and ring spacing grows so the outermost leaves stay legible.
  function layout() {
    const kids = childrenOf();
    const leaves = new Map();
    const countLeaves = (id) => {
      const list = kids.get(id) || [];
      const total = list.length ? list.reduce((sum, n) => sum + countLeaves(n.id), 0) : 1;
      leaves.set(id, total);
      return total;
    };
    const depthOf = (id) => 1 + Math.max(0, ...(kids.get(id) || []).map((n) => depthOf(n.id)));
    const totalLeaves = countLeaves(ROOT);
    const rings = Math.max(1, depthOf(ROOT) - 1);
    const ring = Math.max(150, (totalLeaves * 64) / (2 * Math.PI) / rings);
    const placed = [{ id: ROOT, x: 0, y: 0, depth: 0, branch: 0 }];
    const place = (id, from, to, depth, branch, px, py) => {
      let angle = from;
      (kids.get(id) || []).forEach((n, i) => {
        const span = (to - from) * (leaves.get(n.id) / leaves.get(id));
        const mid = angle + span / 2;
        const x = Math.cos(mid) * ring * (depth + 1);
        const y = Math.sin(mid) * ring * (depth + 1) * 0.86;
        const b = depth === 0 ? i % BRANCHES : branch;
        placed.push({ ...n, x, y, depth: depth + 1, branch: b, px, py });
        place(n.id, angle, angle + span, depth + 1, b, x, y);
        angle += span;
      });
    };
    place(ROOT, -Math.PI / 2, Math.PI * 1.5, 0, 0, 0, 0);
    return placed;
  }

  function nodeButton(n) {
    const el = document.createElement("button");
    el.type = "button";
    el.textContent = n.id === ROOT ? shownTitle() : n.text;
    el.className = `node${n.id === ROOT ? " root" : n.depth === 1 ? " top" : ""}`;
    el.style.left = `${n.x}px`;
    el.style.top = `${n.y}px`;
    el.style.setProperty("--branch", `var(--b${n.branch})`);
    if (n.id !== ROOT) el.addEventListener("click", () => { if (!dragged) openSheet(n); });
    return el;
  }

  function renderMap() {
    const stage = $("stage");
    stage.querySelectorAll(".node").forEach((el) => el.remove());
    const links = $("links");
    links.replaceChildren();
    const placed = layout();
    for (const n of placed) {
      if (n.id !== ROOT) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const cx = (n.px + n.x) / 2;
        const cy = (n.py + n.y) / 2;
        path.setAttribute("d", `M${n.px} ${n.py} Q${cx} ${n.py} ${cx} ${cy} T${n.x} ${n.y}`);
        path.style.stroke = `var(--b${n.branch})`;
        links.append(path);
      }
      stage.append(nodeButton(n));
    }
    const xs = placed.map((n) => n.x);
    const ys = placed.map((n) => n.y);
    bounds = { minX: Math.min(...xs) - 90, maxX: Math.max(...xs) + 90, minY: Math.min(...ys) - 50, maxY: Math.max(...ys) + 50 };
    fit();
  }

  function fit() {
    const box = $("mapView").getBoundingClientRect();
    if (!bounds || !box.width) return;
    const width = bounds.maxX - bounds.minX;
    const height = bounds.maxY - bounds.minY;
    const s = Math.max(0.35, Math.min(1, box.width / width, box.height / height));
    view = { s, x: box.width / 2 - ((bounds.minX + bounds.maxX) / 2) * s, y: box.height / 2 - ((bounds.minY + bounds.maxY) / 2) * s };
    applyView();
  }

  function applyView() {
    $("stage").style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  }

  function renderOutline() {
    const kids = childrenOf();
    const build = (id, depth, branch) => {
      const list = document.createElement("ul");
      (kids.get(id) || []).forEach((n, i) => {
        const b = depth === 0 ? i % BRANCHES : branch;
        const item = document.createElement("li");
        item.className = depth === 0 ? "top" : "";
        item.style.setProperty("--branch", `var(--b${b})`);
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = n.text;
        button.addEventListener("click", () => openSheet(n));
        item.append(button);
        if (kids.has(n.id)) item.append(build(n.id, depth + 1, b));
        list.append(item);
      });
      return list;
    };
    const tree = build(ROOT, 0, 0);
    tree.id = "outline";
    $("outline").replaceWith(tree);
  }

  function render() {
    $("title").textContent = shownTitle();
    const parts = [t("ideas", map.nodes.length)];
    if (map.pending.length) parts.push(t("pendingCount", map.pending.length));
    if (map.example) parts.push(t("example"));
    $("stats").textContent = parts.join(" · ");
    $("empty").hidden = map.nodes.length > 0 || !$("outlineView").hidden;
    $("tidy").hidden = map.nodes.length < 2;
    renderMap();
    renderOutline();
  }

  function showTab(outline) {
    $("mapView").hidden = outline;
    $("outlineView").hidden = !outline;
    $("tabMap").setAttribute("aria-pressed", String(!outline));
    $("tabOutline").setAttribute("aria-pressed", String(outline));
    render();
  }

  function showLock() {
    if (recording) return; // Asked again once the recording ends.
    $("lock").hidden = false;
    $("lockKey").focus();
  }

  function openSheet(n) {
    selected = n;
    $("sheetText").textContent = n.text;
    $("sheetQuote").textContent = n.quote ? t("quote", n.quote) : "";
    $("sheetDelete").textContent = t("delete");
    delete $("sheetDelete").dataset.armed;
    $("sheet").hidden = false;
  }

  /* ---------- Map gestures ---------- */

  const pointers = new Map();
  let dragged = false;
  let pinch = null;
  const mapView = $("mapView");

  mapView.addEventListener("pointerdown", (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY });
    dragged = false;
    pinch = null;
  });
  mapView.addEventListener("pointermove", (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      p.x = e.clientX;
      p.y = e.clientY;
      const distance = Math.hypot(a.x - b.x, a.y - b.y);
      const box = mapView.getBoundingClientRect();
      const cx = (a.x + b.x) / 2 - box.left;
      const cy = (a.y + b.y) / 2 - box.top;
      if (pinch) {
        const s = Math.min(2.5, Math.max(0.3, view.s * (distance / pinch)));
        view.x = cx - ((cx - view.x) / view.s) * s;
        view.y = cy - ((cy - view.y) / view.s) * s;
        view.s = s;
        applyView();
      }
      pinch = distance;
      dragged = true;
      return;
    }
    if (Math.hypot(e.clientX - p.startX, e.clientY - p.startY) > 6) {
      if (!dragged) mapView.setPointerCapture(e.pointerId);
      dragged = true;
    }
    if (dragged) {
      view.x += e.clientX - p.x;
      view.y += e.clientY - p.y;
      applyView();
    }
    p.x = e.clientX;
    p.y = e.clientY;
  });
  const release = (e) => { pointers.delete(e.pointerId); pinch = null; };
  mapView.addEventListener("pointerup", release);
  mapView.addEventListener("pointercancel", release);
  mapView.addEventListener("wheel", (e) => {
    e.preventDefault();
    const box = mapView.getBoundingClientRect();
    const cx = e.clientX - box.left;
    const cy = e.clientY - box.top;
    const s = Math.min(2.5, Math.max(0.3, view.s * (e.deltaY < 0 ? 1.1 : 0.9)));
    view.x = cx - ((cx - view.x) / view.s) * s;
    view.y = cy - ((cy - view.y) / view.s) * s;
    view.s = s;
    applyView();
  }, { passive: false });

  /* ---------- Controls ---------- */

  $("mic").addEventListener("click", startRecording);
  $("focus").addEventListener("click", () => (recording ? finishRecording() : closeFocus()));
  $("upload").addEventListener("change", (e) => { addAudioFile(e.target.files[0]); e.target.value = ""; });
  $("send").addEventListener("click", () => {
    const text = $("note").value;
    $("note").value = "";
    if (text.trim()) enqueue(text);
    else setStatus(recordingUsable ? "nothingTyped" : "nothingDictated");
  });
  $("retry").addEventListener("click", async () => { await uploadClips(); flush(); });
  $("tabMap").addEventListener("click", () => showTab(false));
  $("tabOutline").addEventListener("click", () => showTab(true));
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(toMarkdown(map)); setStatus("copied"); }
    catch { setStatus("copyFailed"); }
  });
  $("sheetClose").addEventListener("click", () => { $("sheet").hidden = true; });
  $("sheetDelete").addEventListener("click", (e) => {
    if (!e.target.dataset.armed) {
      e.target.dataset.armed = "1";
      e.target.textContent = t("deleteConfirm");
      return;
    }
    map = removeSubtree(map, selected.id, Date.now());
    dropUndo();
    $("sheet").hidden = true;
    save();
    render();
  });

  $("tidy").addEventListener("click", tidyMap);
  $("undo").addEventListener("click", () => {
    if (!undoMap) return;
    map = { ...undoMap, pending: map.pending, updatedAt: Date.now() };
    dropUndo();
    save();
    render();
    setStatus("undone");
  });
  $("speechLang").addEventListener("change", (e) => {
    speechLang = e.target.value;
    store.set(SPEECH, speechLang);
  });
  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = $("lockKey").value.trim();
    if (!key) return;
    const res = await fetch("api/auth", { headers: { "x-access-key": encodeURIComponent(key) } }).catch(() => null);
    if (!res || (!res.ok && res.status !== 401)) { $("lockError").textContent = t("lockOffline"); return; }
    if (res.status === 401) { $("lockError").textContent = t("lockWrong"); return; }
    accessKey = key;
    store.set(ACCESS, key);
    $("lock").hidden = true;
    $("lockKey").value = "";
    $("lockError").textContent = "";
    await uploadClips();
    flush();
  });

  $("lang").addEventListener("click", () => {
    lang = lang === "zh" ? "en" : "zh";
    store.set(LANG, lang);
    applyLanguage();
  });
  window.addEventListener("resize", fit);

  applyLanguage();
  if (map.pending.length) {
    setStatus("waiting", false, map.pending.length);
    $("retry").hidden = false;
  }
  // Check the key up front, so the key screen shows before a walk, not after it.
  if (serverMode) api("api/auth").then(uploadClips, (e) => { if (e.code !== "locked") uploadClips(); });
})();
</script>
